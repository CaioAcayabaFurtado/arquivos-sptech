services:
  n8n:
    # n8n e task-runner precisam estar SEMPRE na mesma versão — por isso os
    # dois usam N8N_VERSION (padrão: latest). Pra fixar, defina no .env.
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-America/Sao_Paulo}
      - TZ=${GENERIC_TIMEZONE:-America/Sao_Paulo}
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - N8N_RESTRICT_FILE_ACCESS_TO=/files
      # Code node em Python precisa de um task runner externo (a imagem
      # principal do n8n não traz Python 3 embutido) — configurado abaixo.
      - N8N_RUNNERS_MODE=external
      - N8N_RUNNERS_BROKER_LISTEN_ADDRESS=0.0.0.0
      - N8N_RUNNERS_AUTH_TOKEN=${N8N_RUNNERS_AUTH_TOKEN:-troque-este-token}
      - N8N_NATIVE_PYTHON_RUNNER=true
    volumes:
      - n8n_data:/home/node/.n8n
      - ./local-files:/files
    extra_hosts:
      - "host.docker.internal:host-gateway"

  task-runner:
    image: n8nio/runners:${N8N_VERSION:-latest}
    restart: unless-stopped
    environment:
      - N8N_RUNNERS_TASK_BROKER_URI=http://n8n:5679
      - N8N_RUNNERS_AUTH_TOKEN=${N8N_RUNNERS_AUTH_TOKEN:-troque-este-token}
    depends_on:
      - n8n

  # --- Perfil "beta": n8n 2.33.6 com o módulo Agents/AI Assistant. ---
  # Não sobe com `docker compose up -d`; veja o README pra ativar.
  n8n-agents-beta:
    profiles: ["beta"]
    image: docker.n8n.io/n8nio/n8n:2.33.6
    restart: unless-stopped
    ports:
      - "5680:5678"
    environment:
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-America/Sao_Paulo}
      - TZ=${GENERIC_TIMEZONE:-America/Sao_Paulo}
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - N8N_RESTRICT_FILE_ACCESS_TO=/files
      # Habilita o AI Assistant e a interface "Agents" (beta no self-hosted).
      # Agents exige n8n >= 2.32.3 e, por enquanto, execution mode regular.
      - N8N_ENABLED_MODULES=instance-ai,agents
      - N8N_INSTANCE_AI_MODEL=${N8N_INSTANCE_AI_MODEL:-openai/gpt-5.5}
      - N8N_INSTANCE_AI_MODEL_API_KEY=${N8N_INSTANCE_AI_MODEL_API_KEY:-}
      - N8N_RUNNERS_ENABLED=true
      - N8N_RUNNERS_MODE=external
      - N8N_RUNNERS_BROKER_LISTEN_ADDRESS=0.0.0.0
      - N8N_RUNNERS_AUTH_TOKEN=${N8N_RUNNERS_AUTH_TOKEN:-troque-este-token}
      - N8N_NATIVE_PYTHON_RUNNER=true
    volumes:
      - n8n_beta_data:/home/node/.n8n
      - ./local-files:/files

  task-runner-beta:
    profiles: ["beta"]
    image: n8nio/runners:2.33.6
    restart: unless-stopped
    environment:
      - N8N_RUNNERS_TASK_BROKER_URI=http://n8n-agents-beta:5679
      - N8N_RUNNERS_AUTH_TOKEN=${N8N_RUNNERS_AUTH_TOKEN:-troque-este-token}
    depends_on:
      - n8n-agents-beta

volumes:
  n8n_data:
  n8n_beta_data:
