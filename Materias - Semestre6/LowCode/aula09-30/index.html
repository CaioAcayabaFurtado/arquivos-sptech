<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#10252b">
  <title>Ritmo | Todo list</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap');

    :root {
      --ink: #10252b;
      --muted: #6d7d7e;
      --paper: #f5f1e8;
      --panel: #fffdf8;
      --line: #dfe4dc;
      --mint: #b8e1cf;
      --mint-deep: #22644c;
      --coral: #ef876e;
      --yellow: #f3cf72;
      --shadow: 0 18px 50px rgba(16, 37, 43, 0.09);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 8% 4%, rgba(184, 225, 207, 0.55), transparent 28%),
        radial-gradient(circle at 96% 98%, rgba(239, 135, 110, 0.18), transparent 31%),
        var(--paper);
      font-family: 'DM Sans', sans-serif;
    }

    button, input, select { font: inherit; }
    button { cursor: pointer; }

    .app-shell {
      width: min(1120px, calc(100% - 36px));
      margin: 0 auto;
      padding: 54px 0 72px;
    }

    .topbar, .intro, .toolbar, .task-list { animation: rise-in 0.55s ease both; }
    .intro { animation-delay: 0.08s; }
    .toolbar { animation-delay: 0.16s; }
    .task-list { animation-delay: 0.24s; }

    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 20px; }
    .brand { display: flex; align-items: center; gap: 11px; font-family: 'Space Grotesk', sans-serif; font-size: 1.15rem; font-weight: 700; letter-spacing: 0.02em; }
    .brand-mark { width: 27px; height: 27px; display: grid; place-items: center; color: var(--ink); background: var(--yellow); border-radius: 8px 8px 8px 2px; transform: rotate(-7deg); }
    .brand-mark::after { content: '✓'; transform: rotate(7deg); font-size: 0.9rem; }
    .student-info { color: var(--muted); font-size: 0.76rem; font-weight: 600; text-align: right; }
    .student-info strong { display: block; color: var(--ink); font-size: 0.84rem; }
    .date-label { color: var(--muted); font-size: 0.83rem; font-weight: 600; }

    .intro { display: flex; justify-content: space-between; align-items: end; gap: 28px; margin: 72px 0 35px; }
    h1 { max-width: 650px; margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: clamp(2.6rem, 6vw, 5.3rem); line-height: 0.97; letter-spacing: -0.04em; }
    h1 em { color: var(--mint-deep); font-style: normal; }
    .summary { max-width: 230px; margin: 0 0 4px; color: var(--muted); font-size: 0.94rem; line-height: 1.5; }

    .toolbar { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
    .task-input-wrap { display: flex; flex: 1; align-items: center; gap: 10px; padding: 7px 8px 7px 17px; background: var(--panel); border: 1px solid var(--line); border-radius: 13px; box-shadow: 0 5px 16px rgba(16, 37, 43, 0.04); }
    .task-input-wrap input { width: 100%; min-width: 0; border: 0; outline: 0; color: var(--ink); background: transparent; }
    .task-input-wrap input::placeholder { color: #9aa6a3; }
    .add-btn { flex: 0 0 auto; padding: 11px 19px; color: #fffdf8; background: var(--ink); border: 0; border-radius: 9px; font-weight: 700; transition: transform 0.2s, background 0.2s; }
    .add-btn:hover { background: var(--mint-deep); transform: translateY(-2px); }

    .filters { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 25px; }
    .filter-tabs { display: flex; gap: 5px; padding: 4px; background: rgba(255, 253, 248, 0.7); border: 1px solid var(--line); border-radius: 10px; }
    .filter-tab { padding: 7px 12px; border: 0; border-radius: 7px; color: var(--muted); background: transparent; font-size: 0.82rem; font-weight: 700; }
    .filter-tab.active { color: var(--ink); background: var(--mint); }
    .progress-copy { color: var(--muted); font-size: 0.82rem; }
    .progress-copy strong { color: var(--ink); }

    .task-list { display: grid; gap: 10px; }
    .task { display: flex; align-items: center; gap: 14px; padding: 17px 19px; background: rgba(255, 253, 248, 0.86); border: 1px solid var(--line); border-radius: 13px; box-shadow: 0 5px 16px rgba(16, 37, 43, 0.035); transition: border-color 0.2s, transform 0.2s; }
    .task:hover { border-color: #a8c4b8; transform: translateX(3px); }
    .check { width: 22px; height: 22px; flex: 0 0 22px; display: grid; place-items: center; color: transparent; background: transparent; border: 1.5px solid #9eb0aa; border-radius: 7px; transition: 0.2s; }
    .check:hover { border-color: var(--mint-deep); background: var(--mint); }
    .task.done .check { color: var(--ink); background: var(--mint); border-color: var(--mint-deep); }
    .task-content { min-width: 0; flex: 1; }
    .task-title { margin: 0 0 4px; overflow-wrap: anywhere; font-weight: 600; }
    .task.done .task-title { color: #93a09d; text-decoration: line-through; text-decoration-thickness: 1.5px; }
    .task-meta { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 0.74rem; }
    .priority { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--mint-deep); }
    .priority.high { background: var(--coral); }
    .priority.medium { background: var(--yellow); }
    .delete-btn { padding: 7px; color: #a1adaa; background: transparent; border: 0; font-size: 1rem; line-height: 1; opacity: 0.7; }
    .delete-btn:hover { color: var(--coral); opacity: 1; }
    .empty { padding: 52px 20px; color: var(--muted); text-align: center; border: 1px dashed #bacac0; border-radius: 13px; }
    .empty strong { display: block; margin-bottom: 5px; color: var(--ink); font-family: 'Space Grotesk', sans-serif; font-size: 1.2rem; }

    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 34px; }
    .stat { padding: 18px; border-top: 2px solid var(--ink); }
    .stat-number { display: block; font-family: 'Space Grotesk', sans-serif; font-size: 1.65rem; }
    .stat-label { color: var(--muted); font-size: 0.76rem; }
    .clear-btn { margin-top: 27px; padding: 0; color: var(--muted); background: transparent; border: 0; font-size: 0.78rem; text-decoration: underline; text-underline-offset: 3px; }
    .clear-btn:hover { color: var(--coral); }

    @keyframes rise-in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    @media (max-width: 650px) {
      .app-shell { width: min(100% - 24px, 520px); padding-top: 28px; }
      .intro { display: block; margin-top: 54px; }
      .summary { margin-top: 18px; }
      .toolbar { align-items: stretch; flex-direction: column; }
      .add-btn { padding: 13px; }
      .filters { align-items: start; flex-direction: column; gap: 13px; }
      .filter-tabs { width: 100%; justify-content: space-between; }
      .filter-tab { flex: 1; padding-inline: 5px; }
      .task { padding: 15px 13px; }
    }
  </style>
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div class="brand"><span class="brand-mark" aria-hidden="true"></span> ritmo</div>
      <div class="student-info">
        <strong>Caio Acayaba Furtado</strong>
        <span>RA: 03241026</span>
      </div>
    </header>

    <section class="intro">
      <h1>Organize o dia,<br><em>um passo de cada vez.</em></h1>
      <p class="summary">Um espaço simples para tirar as tarefas da cabeça e colocar o que importa em movimento.</p>
    </section>

    <form class="toolbar" id="task-form">
      <div class="task-input-wrap">
        <input id="task-input" type="text" maxlength="100" placeholder="O que precisa ser feito?" autocomplete="off" required>
        <select id="priority-input" aria-label="Prioridade da tarefa">
          <option value="normal">Normal</option>
          <option value="medium">Média</option>
          <option value="high">Alta</option>
        </select>
      </div>
      <button class="add-btn" type="submit">Adicionar tarefa</button>
    </form>

    <section class="filters" aria-label="Filtros de tarefas">
      <div class="filter-tabs">
        <button class="filter-tab active" data-filter="all" type="button">Todas</button>
        <button class="filter-tab" data-filter="pending" type="button">Pendentes</button>
        <button class="filter-tab" data-filter="done" type="button">Concluídas</button>
      </div>
      <span class="progress-copy" id="progress-copy"></span>
    </section>

    <section class="task-list" id="task-list" aria-live="polite"></section>
    <button class="clear-btn" id="clear-btn" type="button">Limpar tarefas concluídas</button>

    <section class="stats" aria-label="Resumo das tarefas">
      <div class="stat"><span class="stat-number" id="total-count">0</span><span class="stat-label">tarefas no total</span></div>
      <div class="stat"><span class="stat-number" id="pending-count">0</span><span class="stat-label">em andamento</span></div>
      <div class="stat"><span class="stat-number" id="done-count">0</span><span class="stat-label">finalizadas</span></div>
    </section>
  </main>

  <script>
    const storageKey = 'ritmo-tasks';
    let tasks = JSON.parse(localStorage.getItem(storageKey) || '[]');
    let activeFilter = 'all';

    const taskForm = document.querySelector('#task-form');
    const taskInput = document.querySelector('#task-input');
    const priorityInput = document.querySelector('#priority-input');
    const taskList = document.querySelector('#task-list');
    const progressCopy = document.querySelector('#progress-copy');

    document.querySelector('#today').textContent = new Intl.DateTimeFormat('pt-BR', {
      weekday: 'long', day: 'numeric', month: 'long'
    }).format(new Date());

    function saveTasks() {
      localStorage.setItem(storageKey, JSON.stringify(tasks));
    }

    function addTask(title, priority) {
      tasks.unshift({ id: Date.now(), title, priority, done: false });
      saveTasks();
      render();
    }

    function getVisibleTasks() {
      if (activeFilter === 'pending') return tasks.filter(task => !task.done);
      if (activeFilter === 'done') return tasks.filter(task => task.done);
      return tasks;
    }

    function render() {
      const visibleTasks = getVisibleTasks();
      const pending = tasks.filter(task => !task.done).length;
      const done = tasks.length - pending;
      taskList.innerHTML = '';

      if (!visibleTasks.length) {
        taskList.innerHTML = '<div class="empty"><strong>Nada por aqui.</strong><span>Adicione uma tarefa e comece o seu ritmo.</span></div>';
      } else {
        visibleTasks.forEach(task => {
          const item = document.createElement('article');
          item.className = `task${task.done ? ' done' : ''}`;
          item.innerHTML = `
            <button class="check" type="button" data-action="toggle" data-id="${task.id}" aria-label="${task.done ? 'Reabrir' : 'Concluir'} tarefa">${task.done ? '✓' : ''}</button>
            <div class="task-content">
              <p class="task-title">${escapeHtml(task.title)}</p>
              <div class="task-meta"><span class="priority ${task.priority}"></span>${task.priority === 'high' ? 'Alta' : task.priority === 'medium' ? 'Média' : 'Normal'}</div>
            </div>
            <button class="delete-btn" type="button" data-action="delete" data-id="${task.id}" aria-label="Excluir tarefa">×</button>`;
          taskList.appendChild(item);
        });
      }

      document.querySelector('#total-count').textContent = tasks.length;
      document.querySelector('#pending-count').textContent = pending;
      document.querySelector('#done-count').textContent = done;
      progressCopy.innerHTML = `<strong>${pending}</strong> ${pending === 1 ? 'tarefa pendente' : 'tarefas pendentes'}`;
    }

    function escapeHtml(value) {
      return value.replace(/[&<>'"]/g, character => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#039;', '"': '&quot;' }[character]));
    }

    taskForm.addEventListener('submit', event => {
      event.preventDefault();
      const title = taskInput.value.trim();
      if (!title) return;
      addTask(title, priorityInput.value);
      taskInput.value = '';
      priorityInput.value = 'normal';
      taskInput.focus();
    });

    taskList.addEventListener('click', event => {
      const button = event.target.closest('button[data-action]');
      if (!button) return;
      const id = Number(button.dataset.id);
      if (button.dataset.action === 'toggle') {
        tasks = tasks.map(task => task.id === id ? { ...task, done: !task.done } : task);
      } else {
        tasks = tasks.filter(task => task.id !== id);
      }
      saveTasks();
      render();
    });

    document.querySelectorAll('.filter-tab').forEach(button => {
      button.addEventListener('click', () => {
        activeFilter = button.dataset.filter;
        document.querySelectorAll('.filter-tab').forEach(tab => tab.classList.toggle('active', tab === button));
        render();
      });
    });

    document.querySelector('#clear-btn').addEventListener('click', () => {
      tasks = tasks.filter(task => !task.done);
      saveTasks();
      render();
    });

    render();
  </script>
</body>
</html>
