AWSTemplateFormatVersion: "2010-09-09"
Description: "Simple EC2 instance created by Lambda"

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetId:
    Type: AWS::EC2::Subnet::Id
  InstanceType:
    Type: String
    Default: t3.micro
  KeyName:
    Type: String
    Default: ""
  AllowedSshCidr:
    Type: String
    Default: "0.0.0.0/0"

Conditions:
  HasKeyName: !Not [!Equals [!Ref KeyName, ""]]

Resources:
  SimpleSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: simple-ec2-ssh
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref AllowedSshCidr

  SimpleInstance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !Sub "{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64}}"
      NetworkInterfaces:
        - DeviceIndex: 0
          AssociatePublicIpAddress: true
          SubnetId: !Ref SubnetId
          GroupSet:
            - !Ref SimpleSecurityGroup
      KeyName: !If [HasKeyName, !Ref KeyName, !Ref "AWS::NoValue"]

Outputs:
  InstanceId:
    Value: !Ref SimpleInstance
  PublicIp:
    Value: !GetAtt SimpleInstance.PublicIp
  PublicDnsName:
    Value: !GetAtt SimpleInstance.PublicDnsName
