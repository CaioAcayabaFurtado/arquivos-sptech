<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <title>Formulário Pessoas</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 20px;
        background: #f5f7fa;
        color: #333;
      }

      h2,
      h3 {
        text-align: center;
        color: #2c3e50;
      }

      .form-container {
        max-width: 500px;
        margin: 20px auto;
        padding: 20px;
        background: #fff;
        border: 1px solid #ddd;
        border-radius: 8px;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
      }

      .form-group {
        display: flex;
        flex-direction: column;
        margin-bottom: 15px;
      }

      .form-group label {
        font-weight: bold;
        margin-bottom: 5px;
      }

      .form-group input {
        padding: 8px;
        border: 1px solid #ccc;
        border-radius: 5px;
      }

      .buttons {
        display: flex;
        justify-content: center;
        gap: 10px;
        margin-bottom: 15px;
      }

      button {
        flex: 1; /* ocupa espaço igualmente */
        background: #3498db;
        color: white;
        border: none;
        padding: 10px;
        border-radius: 5px;
        cursor: pointer;
        transition: background 0.3s;
      }

      button:hover {
        background: #2980b9;
      }

      ul {
        list-style: none;
        padding: 0;
        margin: 0;
      }

      li {
        background: #ecf0f1;
        margin: 5px 0;
        padding: 10px;
        border-radius: 5px;
        border: 1px solid #ccc;
        display: flex;
        justify-content: space-between;
      }
    </style>
  </head>
  <body>
    <h2>Cadastro de Pessoas</h2>

    <div class="form-container">
      <div class="form-group">
        <label for="id">ID:</label>
        <input type="text" id="id" />
      </div>

      <div class="form-group">
        <label for="nome">Nome:</label>
        <input type="text" id="nome" />
      </div>

      <div class="buttons">
        <button onclick="adicionar()">Adicionar</button>
        <button onclick="alterar()">Alterar</button>
        <button onclick="remover()">Remover</button>
      </div>

      <h3>Lista de Pessoas</h3>
      <ul id="lista"></ul>
    </div>

    <script>
      let pessoas = [];
      function mostrar() {
        let mensagem = document.getElementById("lista");

        fetch('http://localhost:8080/pessoas',{
          method: 'GET',
          headers: {
            'Content-Type': 'application/json'
          }
        })
          .then((resposta) => resposta.json())
          .then((dados) => {
            pessoas = dados
            console.log(pessoas)
            const lista_mensagem = pessoas.map((p)=>`<li>${p.id} - ${p.nome}</li>`)
            mensagem.innerHTML = lista_mensagem
          })
          .catch((erro) => {
            alert('Erro ao buscar pessoas:', erro);
          });
      }

      function adicionar() {
        const nome = document.getElementById("nome").value;
        const id = document.getElementById("id").value;

        console.log(id, nome);

        fetch('http://localhost:8080/pessoas', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ id, nome })
        })
        .then((resposta) => resposta.json())
        .then((dados) => mostrar())
        .catch((erro)=>{
          alert('Erro ao adicionar pessoa:', erro)
        })

      }

      function alterar() {
        const nome = document.getElementById("nome").value;
        const id = document.getElementById("id").value;
        fetch(`http://localhost:8080/pessoas/${id}`, {
          method: 'PATCH',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ nome })
        })
        .then((resposta) => resposta.json())
        .then((dados) => mostrar())
        .catch((erro)=> alert('Erro ao alterar pessoa:', erro))
      }

      function remover() {
        const id = document.getElementById("id").value;
        fetch(`http://localhost:8080/pessoas/${id}`, {
          method: 'DELETE'
        })
        .then((resposta) => resposta.json())
        .then((dados) => mostrar())
        .catch((erro)=> alert('Erro ao remover pessoa:', erro))
      }
    </script>
  </body>
</html>
