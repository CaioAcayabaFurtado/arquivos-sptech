===========================================
TUTORIAL DE MÉTODOS DE ARRAYS JS
===========================================

📌 DICA IMPORTANTE:
Muitos métodos como filter, map, find, some, every e reduce 
recebem uma FUNÇÃO DE CALLBACK como parâmetro.

Essa função pode receber até 3 argumentos:
(elemento, indice, array)

- elemento → valor atual
- indice → posição do valor no array
- array → o array completo

Na prática, quase sempre usamos só o "elemento".

Exemplo rápido:
let numeros = [10, 20, 30];
numeros.filter((elemento, indice, array) => {
  console.log("Elemento:", elemento, "Índice:", indice, "Array:", array);
});

-------------------------------------------
1) push()
   - Adiciona elementos ao final do array.
   - Exemplo:
     let arr = [1,2,3];
     arr.push(4); // [1,2,3,4]

2) pop()
   - Remove o último elemento do array.
   - Exemplo:
     let arr = [1,2,3];
     arr.pop(); // [1,2]

3) unshift()
   - Adiciona elementos no início do array.
   - Exemplo:
     let arr = [1,2,3];
     arr.unshift(0); // [0,1,2,3]

4) shift()
   - Remove o primeiro elemento do array.
   - Exemplo:
     let arr = [1,2,3];
     arr.shift(); // [2,3]

5) concat()
   - Junta dois ou mais arrays (não altera os originais).
   - Exemplo:
     [1,2].concat([3,4]); // [1,2,3,4]

6) join()
   - Converte array em string, separando por um delimitador.
   - Exemplo:
     [1,2,3].join('-'); // "1-2-3"


===========================================
     SLICE() vs SPLICE() em Arrays JS
===========================================

📌 Embora os nomes sejam parecidos, eles funcionam de formas diferentes:

-------------------------------------------
7) slice()
-------------------------------------------
- NÃO altera o array original.
- Serve para "fatiar" (copiar parte de um array).
- Sintaxe: array.slice(inicio, fim)

⚡ Exemplo:
let arr = [10, 20, 30, 40, 50];

let parte = arr.slice(1, 3);
console.log(parte); // [20, 30]
console.log(arr);   // [10, 20, 30, 40, 50]  (original continua igual)

➡️ Dica: 
- O "fim" é EXCLUSIVO (não inclui o índice final).
- Para clonar todo o array: arr.slice()

-------------------------------------------
8) splice()
-------------------------------------------
- ALTERA o array original.
- Serve para remover, substituir ou adicionar elementos.
- Sintaxe: array.splice(inicio, quantidade, item1, item2, ...)

⚡ Exemplo 1 (remover):
let arr = [10, 20, 30, 40, 50];
arr.splice(1, 2);  
console.log(arr); // [10, 40, 50]

➡️ Removeu 2 elementos a partir do índice 1 → (20, 30).

⚡ Exemplo 2 (substituir):
let arr = [10, 20, 30];
arr.splice(1, 1, 99);
console.log(arr); // [10, 99, 30]

➡️ Removeu 1 elemento no índice 1 (20) e colocou 99 no lugar.

⚡ Exemplo 3 (adicionar sem remover):
let arr = [10, 20, 30];
arr.splice(1, 0, 15, 17);
console.log(arr); // [10, 15, 17, 20, 30]

➡️ Removeu 0 elementos e adicionou 15 e 17 no índice 1.

-------------------------------------------
✅ Resumindo
-------------------------------------------
- slice() → faz uma cópia parcial, NÃO altera o original.
- splice() → altera o array: pode REMOVER, TROCAR ou ADICIONAR elementos.

9) indexOf()
   - Retorna o índice da primeira ocorrência do elemento.
   - Exemplo:
     [1,2,3].indexOf(2); // 1

10) lastIndexOf()
    - Retorna o índice da última ocorrência do elemento.
    - Exemplo:
      [1,2,1].lastIndexOf(1); // 2

11) includes()
    - Verifica se o array contém determinado elemento.
    - Exemplo:
      [1,2,3].includes(2); // true

12) filter()
    - Retorna os elementos que satisfazem a condição.
    - A função precisa retornar true (fica) ou false (descarta).
    - Exemplo prático:
      let numeros = [1,2,3,4,5];
      let pares = numeros.filter(n => n % 2 === 0);
      console.log(pares); // [2,4]

13) map()
    - Cria um novo array transformando cada elemento.
    - Exemplo prático:
      let numeros = [1,2,3,4];
      let dobrados = numeros.map(n => n * 2);
      console.log(dobrados); // [2,4,6,8]

14) find()
    - Retorna o PRIMEIRO elemento que satisfaz a condição.
    - Exemplo prático:
      let numeros = [5,12,8,130];
      let maior10 = numeros.find(n => n > 10);
      console.log(maior10); // 12

15) findIndex()
    - Retorna o índice do PRIMEIRO elemento que satisfaz a condição.
    - Exemplo:
      [1,2,3].findIndex(x => x > 1); // 1

16) some()
    - Verifica se ALGUM elemento satisfaz a condição.
    - Exemplo prático:
      let numeros = [1,2,3,4];
      console.log(numeros.some(n => n > 3)); // true

17) every()
    - Verifica se TODOS os elementos satisfazem a condição.
    - Exemplo prático:
      let numeros = [1,2,3];
      console.log(numeros.every(n => n > 0)); // true
      console.log(numeros.every(n => n > 2)); // false

18) reduce()
    - Reduz o array a um único valor (da esquerda p/ direita).
    - Recebe (acumulador, elemento).
    - Exemplo prático:
      let numeros = [1,2,3,4];
      let soma = numeros.reduce((acc, n) => acc + n, 0);
      console.log(soma); // 10

19) reduceRight()
    - Igual ao reduce, mas vai da direita p/ esquerda.
    - Exemplo:
      [1,2,3].reduceRight((a,b) => a-b); // 0

20) forEach()
    - Executa uma função para cada elemento (não retorna array).
    - Exemplo prático:
      let nomes = ["Caio","Ana","Lucas"];
      nomes.forEach((nome, i) => {
        console.log(`Nome ${i}: ${nome}`);
      });

===========================================
          TUTORIAL DE .SORT() EM JS
===========================================

📌 O método .sort() serve para ordenar os elementos de um array.
⚠️ Atenção: por padrão, ele ordena como STRINGS, mesmo que os elementos sejam números.

-------------------------------------------
1) Ordenação básica de strings
-------------------------------------------
let frutas = ["banana", "maçã", "laranja", "uva"];
frutas.sort();
console.log(frutas);
// Saída: [ 'banana', 'laranja', 'maçã', 'uva' ]
// ✔️ Ordenação alfabética
// ❌ Strings com acentos podem não ficar na ordem esperada
// Use localeCompare para ordenação correta de textos com acento.

-------------------------------------------
2) Problema comum com números
-------------------------------------------
let numeros = [10, 1, 30, 4, 20];
numeros.sort();
console.log(numeros);
// Saída: [ 1, 10, 20, 30, 4 ]
// ❌ Ordenou como string → "10", "1", "30", "4", "20"

-------------------------------------------
3) Solução com função de comparação
-------------------------------------------
// Crescente
let numerosCrescente = [10, 1, 30, 4, 20];
numerosCrescente.sort((a, b) => a - b);
console.log(numerosCrescente); // [1, 4, 10, 20, 30]

// Decrescente
let numerosDecrescente = [10, 1, 30, 4, 20];
numerosDecrescente.sort((a, b) => b - a);
console.log(numerosDecrescente); // [30, 20, 10, 4, 1]

-------------------------------------------
4) Ordenando objetos
-------------------------------------------
let pessoas = [
  { nome: "Caio", idade: 21 },
  { nome: "Ana", idade: 19 },
  { nome: "Bruno", idade: 25 }
];

// Ordenar por idade (crescente)
pessoas.sort((a, b) => a.idade - b.idade);
console.log(pessoas); // [ Ana:19, Caio:21, Bruno:25 ]

// Ordenar por nome (alfabética)
pessoas.sort((a, b) => a.nome.localeCompare(b.nome));
console.log(pessoas); // [ Ana, Bruno, Caio ]
// ✔️ localeCompare respeita acentos e regras do idioma

-------------------------------------------
✅ DICAS IMPORTANTES
-------------------------------------------
1) sort() sozinho → ordena como string.
2) Números → sempre usar função de comparação (a - b ou b - a).
3) Objetos → comparar a propriedade desejada.
4) Strings com acento → usar localeCompare().

22) reverse()
    - Inverte a ordem dos elementos (altera o array).
    - Exemplo:
      [1,2,3].reverse(); // [3,2,1]

23) flat()
    - "Achata" arrays aninhados em um único nível.
    - Exemplo:
      [1,[2,3]].flat(); // [1,2,3]

24) flatMap()
    - Mapeia e achata o resultado em um único array.
    - Exemplo:
      [1,2].flatMap(x => [x*2]); // [2,4]

25) at()
    - Acessa elemento pelo índice (suporta negativos).
    - Exemplo:
      [1,2,3].at(-1); // 3

26) toReversed() (ES2023)
    - Retorna um novo array invertido (não altera o original).
    - Exemplo:
      [1,2,3].toReversed(); // [3,2,1]

27) toSorted() (ES2023)
    - Retorna um novo array ordenado (não altera o original).
    - Exemplo:
      [3,1,2].toSorted(); // [1,2,3]

28) toSpliced() (ES2023)
    - Versão imutável do splice (retorna novo array).
    - Exemplo:
      [1,2,3].toSpliced(1,1,'x'); // [1,'x',3]

29) with() (ES2023)
    - Cria uma cópia do array substituindo um índice.
    - Exemplo:
      [1,2,3].with(1,9); // [1,9,3]
