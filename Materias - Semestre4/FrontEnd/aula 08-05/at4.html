<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<!-- 
4. Crie um programa o qual:   

a) Pergunte, numa input ou lista suspensa (select/option), qual a tabuada que o usuário quer ver na tela (2 a 9);  
b) Pergunte até que número a tabuada deve ser construída;  
c) Ao clicar no botão “Ver Tabuada”, exiba abaixo a tabuada como neste exemplo (considerando que o usuário escolheu a tabuada do 3 e para ir até o 12).  
    3 x 1 = 3   
    3 x 2 = 6   
    3 x 3 = 9   
    3 x 4 = 12   
    3 x 5 = 15   
    3 x 6 = 18   
    3 x 7 = 21   
    3 x 8 = 24   
    3 x 9 = 27   
    3 x 10 = 30   
    3 x 11 = 33  
    3 x 12 = 36       
-->
    <h1>Ver Tabuada</h1>
    <h3>Escolha a tabuada (2 a 9):</h3>
    <input type="number" id="tabuada"></input><br>
    <h3>Até qual número deve ser construída a tabuada?</h3>
    <input type="number" id="ate_numero"></input><br>
    <button onclick="verTabuada()">Ver Tabuada</button><br>
    <p id="mensagem_resultado"></p>

</body>
<script>
    function verTabuada(){
        const number = parseInt(document.getElementById("tabuada").value);
        const ate = parseInt(document.getElementById("ate_numero").value);
        let mensagem = "";
        for (let i = 1; i<=ate; i++){
            mensagem += `${number} x ${i} = ${number * i}<br>`;
        }
        console.log(mensagem)
        document.getElementById("mensagem_resultado").innerHTML = mensagem;
    }
</script>
</html>
